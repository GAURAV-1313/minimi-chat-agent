<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pip · web search with a memory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/vendor/purify.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-cat" aria-hidden="true"></span>
        <span class="brand-name">Pip</span>
      </div>
      <button id="new-chat" type="button">New chat</button>
      <nav id="threads" aria-label="Earlier chats"></nav>
      <p class="memo">Chats are kept on this computer, by day, so you can come back and ask what's changed since.</p>
    </aside>

    <main>
      <header>
        <button id="toggle-sidebar" type="button" aria-label="Show earlier chats">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        </button>
        <span class="header-title">Pip</span>
      </header>

      <div id="banner" role="alert" hidden></div>

      <section id="log" aria-live="polite"></section>

      <div class="dock">
        <form id="composer">
          <div class="perch">
            <span id="pip-says" role="status"></span>
            <div id="pip"></div>
          </div>
          <label for="input" class="sr-only">Message</label>
          <textarea id="input" rows="1" placeholder="Ask about a price, a release, the news, or an earlier chat" autofocus></textarea>
          <button id="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </form>
        <p class="fineprint">Every fact links to its source and how old that source is. Check anything important before you rely on it.</p>
      </div>
    </main>
  </body>
</html>
